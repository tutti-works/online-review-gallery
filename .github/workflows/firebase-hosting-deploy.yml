name: Deploy to Firebase Hosting (manual)
on:
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: '${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}'
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: '${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: '${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}'
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: '${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}'
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}'
      NEXT_PUBLIC_FIREBASE_APP_ID: '${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}'
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: '${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}'
      NEXT_PUBLIC_FUNCTIONS_BASE_URL: '${{ vars.NEXT_PUBLIC_FUNCTIONS_BASE_URL }}'
      NEXT_PUBLIC_USE_AUTH_EMULATOR: '${{ vars.NEXT_PUBLIC_USE_AUTH_EMULATOR }}'
      NEXT_PUBLIC_USE_FIRESTORE_EMULATOR: '${{ vars.NEXT_PUBLIC_USE_FIRESTORE_EMULATOR }}'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: '${{ secrets.FIREBASE_TOKEN }}'
        run: |
          npm install -g firebase-tools
          firebase experiments:enable webframeworks
          firebase deploy --only hosting --token "$FIREBASE_TOKEN"
